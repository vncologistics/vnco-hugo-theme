[build]
  command = "hugo --gc --minify"
  publish = "public"

[build.environment]
  HUGO_VERSION = "0.146.0"
  NODE_VERSION = "22"

# Custom 404 fallback handled automatically by Netlify when public/404.html exists.
# Explicit 404 status redirect rule for unmatched routes:
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
